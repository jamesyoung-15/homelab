---
- name: Set system timezone
  community.general.timezone:
    name: "{{  common_baseline_timezone }}"
  tags: [common_baseline, timezone]

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_baseline_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: [common_baseline, packages]

- name: Ensure journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [common_baseline, journald]

- name: Cap journald disk usage
  ansible.builtin.template:
    src: journald-size.conf.j2
    dest: /etc/systemd/journald.conf.d/10-size.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald
  tags: [common_baseline, journald]

- name: Harden sshd
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd
  tags: [common_baseline, sshd]

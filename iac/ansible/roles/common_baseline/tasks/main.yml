---
- name: Set system timezone
  community.general.timezone:
    name: "{{  common_baseline_timezone }}"
  tags: [common_baseline, timezone]

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_baseline_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: [common_baseline, packages]

- name: Install QEMU guest agent
  ansible.builtin.apt:
    name: qemu-guest-agent
    state: present
  when:
    - ansible_facts['virtualization_type'] == 'kvm'
    - ansible_facts['virtualization_role'] == 'guest'
  tags: [common_baseline, packages]

- name: Ensure journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [common_baseline, journald]

- name: Cap journald disk usage
  ansible.builtin.template:
    src: journald-size.conf.j2
    dest: /etc/systemd/journald.conf.d/10-size.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald
  tags: [common_baseline, journald]

- name: Harden sshd
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd
  tags: [common_baseline, sshd]

- name: Dist-upgrade
  ansible.builtin.apt:
    upgrade: dist
    update_cache: true
  when: common_baseline_upgrade
  tags: [common_baseline, upgrade]

- name: Find installed kernels
  ansible.builtin.find:
    paths: /boot
    patterns: "vmlinuz-*"
  register: common_baseline_installed_kernels
  when: common_baseline_upgrade
  tags: [common_baseline, upgrade]

- name: Reboot if running an older kernel than installed
  ansible.builtin.reboot:
    reboot_timeout: 600
  vars:
    common_baseline_latest_kernel: >-
      {{ common_baseline_installed_kernels.files | map(attribute='path') | map('basename')
         | map('regex_replace', '^vmlinuz-', '') | community.general.version_sort | last }}
  when:
    - common_baseline_latest_kernel != ansible_facts['kernel']
    - common_baseline_upgrade
  tags: [commonbaseline, upgrade]


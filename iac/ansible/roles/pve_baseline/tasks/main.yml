---
- name: Disable enterprise repos
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    regexp: "^Enabled:"
    line: "Enabled: false"
    insertafter: "^Types:"
  loop: "{{ pve_baseline_enterprise_sources }}"
  tags: [pve_baseline, repos]

- name: Add no-subscription repo
  ansible.builtin.template:
    src: pve.sources.j2
    dest: /etc/apt/sources.list.d/pve.sources
    owner: root
    group: root
    mode: "0644"
  tags: [pve_baseline, repos]

- name: Disable HA services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: [pve-ha-lrm, pve-ha-crm]
  when: pve_baseline_disable_ha
  tags: [pve_baseline, ha]

- name: Install QDevice client
  ansible.builtin.apt:
    name: corosync-qdevice
    state: present
  tags: [pve_baseline, qdevice]

- name: Ensure snippets directory exists
  ansible.builtin.file:
    path: /var/lib/vz/snippets
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [pve_baseline, snippets]

- name: Add cloud-init vendor data for QEMU guest agent
  ansible.builtin.copy:
    src: vendor-qemu-agent.yml
    dest: /var/lib/vz/snippets/vendor-qemu-agent.yml
    owner: root
    group: root
    mode: "0644"
  tags: [pve_baseline, snippets]

- name: Assert root SSH login stays enabled
  ansible.builtin.assert:
    that:
      - (common_baseline_sshd_permit_root_login | default('no')) in ['yes', 'prohibit-password']
    fail_msg: >-
      PVE nodes need root SSH (cluster, QDevice setup, Ansible connects as root).
      Set common_baseline_sshd_permit_root_login: prohibit-password in the group's group_vars.
    quiet: true
  tags: [pve_baseline, always]

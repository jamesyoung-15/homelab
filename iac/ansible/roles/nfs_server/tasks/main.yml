---
- name: Install NFS server (Debian)
  ansible.builtin.apt:
    name:
      - nfs-kernel-server
      - nfs-common
    state: present
    update_cache: true
  when: ansible_facts["os_family"] == "Debian"

- name: Configure NFS exports from template
  ansible.builtin.template:
    src: exports.j2
    dest: /etc/exports
    owner: root
    group: root
    mode: '0644'
  notify: Reload NFS exports

- name: Enable NFS server
  ansible.builtin.systemd:
    name: nfs-server
    state: started
    enabled: true
